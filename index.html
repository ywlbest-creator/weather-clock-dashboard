<title>天气时钟</title>
<style>
  * { -webkit-box-sizing: border-box; box-sizing: border-box; margin: 0; padding: 0; }
  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;

  }
  html, body {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  body {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    flex-direction: column;
    padding: 12px;

    height: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
    background: #04060d;
    color: #dceaff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  .sky {
    display: block;
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(1200px 700px at 20% 30%, rgba(40,80,180,0.25), transparent 55%),
                radial-gradient(900px 600px at 90% 80%, rgba(90,40,160,0.18), transparent 50%), #04060d;
  }
  .halo {
    display: block;
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
  }
  .halo.a {
    width: 500px; height: 500px; left: -10%; top: -10%;
    background: rgba(60,120,255,0.18);
    filter: blur(60px);
    -webkit-animation: driftA 32s ease-in-out infinite;
    animation: driftA 32s ease-in-out infinite;
  }
  .halo.b {
    width: 420px; height: 420px; right: -8%; bottom: 0;
    background: rgba(140,80,255,0.14);
    filter: blur(70px);
    -webkit-animation: driftB 40s ease-in-out infinite;
    animation: driftB 40s ease-in-out infinite;
  }
  @-webkit-keyframes driftA { 0%,100% { -webkit-transform: translate(0,0); transform: translate(0,0); } 50% { -webkit-transform: translate(60px, 30px); transform: translate(60px, 30px); } }
  @keyframes driftA { 0%,100% { -webkit-transform: translate(0,0); transform: translate(0,0); } 50% { -webkit-transform: translate(60px, 30px); transform: translate(60px, 30px); } }
  @-webkit-keyframes driftB { 0%,100% { -webkit-transform: translate(0,0); transform: translate(0,0); } 50% { -webkit-transform: translate(-40px, -40px); transform: translate(-40px, -40px); } }
  @keyframes driftB { 0%,100% { -webkit-transform: translate(0,0); transform: translate(0,0); } 50% { -webkit-transform: translate(-40px, -40px); transform: translate(-40px, -40px); } }

  .main {
    position: relative;
    z-index: 1;
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 auto;
    flex: 1 1 auto;
    min-height: 0;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    width: 100%;
    height: 100%;
  }
  .block-time, .block-wear, .block-weather {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
  }
  .block-time {
    width: 50%;
    height: 50%;
    padding: 8px 16px 8px 8px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    -webkit-box-ordinal-group: 2;
    -webkit-order: 1;
    order: 1;
  }
  .block-wear {
    width: 50%;
    height: 50%;
    padding: 20px 24px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    -webkit-box-ordinal-group: 3;
    -webkit-order: 2;
    order: 2;
  }
  .block-weather {
    width: 50%;
    height: 100%;
    padding: 16px 16px 12px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    -webkit-box-ordinal-group: 4;
    -webkit-order: 3;
    order: 3;
  }
  #clock, #now-temp {
    font-size: 96px;
    font-size: 10.5vw;
    font-size: clamp(64px, 18vmin, 200px);
    font-weight: 200;
    font-variation-settings: "wght" 200;
    letter-spacing: -0.05em;
    line-height: 0.88;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  #clock {
    color: #edf5ff;
    text-shadow: 0 0 16px rgba(100,170,255,0.45), 0 0 48px rgba(80,130,255,0.2);
    -webkit-animation: digitGlow 5s ease-in-out infinite;
    animation: digitGlow 5s ease-in-out infinite;
  }
  @-webkit-keyframes digitGlow {
    0%,100% { text-shadow: 0 0 14px rgba(100,170,255,0.35), 0 0 40px rgba(80,130,255,0.15); }
    50% { text-shadow: 0 0 22px rgba(140,190,255,0.55), 0 0 60px rgba(100,150,255,0.28); }
  }
  @keyframes digitGlow {
    0%,100% { text-shadow: 0 0 14px rgba(100,170,255,0.35), 0 0 40px rgba(80,130,255,0.15); }
    50% { text-shadow: 0 0 22px rgba(140,190,255,0.55), 0 0 60px rgba(100,150,255,0.28); }
  }
  #date-line {
    margin-top: 14px;
    font-size: 22px;
    font-size: 3.2vw;
    font-size: clamp(16px, 4.4vmin, 42px);
    font-weight: 400;
    line-height: 1.3;
    color: rgba(160,190,230,0.7);
    white-space: nowrap;
    overflow: hidden;
  }
  #updated {
    margin-top: 8px;
    font-size: 12px;
    font-size: clamp(11px, 1.5vmin, 16px);
    letter-spacing: 0.08em;
    color: rgba(120,170,255,0.55);
  }
  #updated.stale { color: #ffb347; }
  #updated:before, #updated::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4da3ff;
    margin-right: 8px;
    box-shadow: 0 0 8px #4da3ff;
    -webkit-animation: live 2.2s ease-in-out infinite;
    animation: live 2.2s ease-in-out infinite;
    vertical-align: 1px;
  }
  @-webkit-keyframes live { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes live { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .block-weather, .block-wear {
    position: relative;
    border: 1px solid rgba(90,150,255,0.38);
    border-radius: 8px;
    background: rgba(8,12,28,0.55);
    box-shadow: 0 0 0 1px rgba(90,150,255,0.06), 0 0 32px rgba(40,80,200,0.12);
    -webkit-animation: frameBreath 8s ease-in-out infinite;
    animation: frameBreath 8s ease-in-out infinite;
  }
  @-webkit-keyframes frameBreath {
    0%,100% { box-shadow: 0 0 0 1px rgba(90,150,255,0.06), 0 0 28px rgba(40,80,200,0.1); }
    50% { box-shadow: 0 0 0 1px rgba(90,150,255,0.12), 0 0 40px rgba(70,110,255,0.2); }
  }
  @keyframes frameBreath {
    0%,100% { box-shadow: 0 0 0 1px rgba(90,150,255,0.06), 0 0 28px rgba(40,80,200,0.1); }
    50% { box-shadow: 0 0 0 1px rgba(90,150,255,0.12), 0 0 40px rgba(70,110,255,0.2); }
  }
  .block-weather:before, .block-wear:before,
  .block-weather::before, .block-wear::before {
    content: "";
    position: absolute;
    left: 5px; top: 5px; right: 5px; bottom: 5px;
    border: 1px solid rgba(90,150,255,0.12);
    border-radius: 5px;
    pointer-events: none;
  }

  .wx-hero { text-align: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .loc {
    font-size: 16px;
    font-size: clamp(14px, 2.4vmin, 24px);
    font-weight: 500;
    letter-spacing: 0.16em;
    color: #8cbcff;
  }
  .loc-sub {
    font-size: 12px;
    font-size: clamp(11px, 1.6vmin, 16px);
    margin-top: 4px;
    letter-spacing: 0.2em;
    color: rgba(140,188,255,0.55);
  }
  #now-temp { color: #fff; text-shadow: 0 0 18px rgba(100,170,255,0.3); margin-top: 2px; }
  #now-desc { font-size: 18px; font-size: clamp(15px, 2.4vmin, 24px); margin-top: 2px; color: #8cbcff; }
  #now-hl, #now-feel { font-size: 14px; font-size: clamp(13px, 1.9vmin, 18px); margin-top: 4px; color: rgba(160,190,230,0.55); }

  .aqi { margin-top: 14px; -webkit-flex-shrink: 0; flex-shrink: 0; text-align: left; }
  .aqi-head { display: block; }
  .aqi-head span { display: inline-block; margin-right: 10px; vertical-align: baseline; }
  .aqi-title { font-size: 12px; font-size: clamp(11px, 1.5vmin, 14px); letter-spacing: 0.1em; font-weight: 600; color: rgba(160,190,230,0.55); }
  .aqi-num { font-size: 22px; font-size: clamp(18px, 3vmin, 28px); font-weight: 300; font-variant-numeric: tabular-nums; color: #f0f6ff; }
  .aqi-lab { font-size: 14px; font-size: clamp(13px, 1.8vmin, 17px); color: rgba(160,190,230,0.55); }
  .aqi-bar {
    margin-top: 10px; height: 6px; border-radius: 99px; position: relative;
    background: #00e400;
    background: -webkit-linear-gradient(left, #00e400 0%, #ffff00 20%, #ff7e00 40%, #ff0000 60%, #8f3f97 80%, #7e0023 100%);
    background: linear-gradient(90deg, #00e400 0%, #ffff00 20%, #ff7e00 40%, #ff0000 60%, #8f3f97 80%, #7e0023 100%);
  }
  .aqi-thumb {
    position: absolute; top: 50%; width: 11px; height: 11px; margin-left: -5.5px; margin-top: -5.5px;
    border-radius: 50%; background: #8cbcff;
    box-shadow: 0 0 0 2px #04060d, 0 0 12px #4da3ff;
  }

  .hours {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    margin-top: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    -ms-overflow-style: none;
    scrollbar-width: none;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .hours::-webkit-scrollbar { display: none; }
  .hour { -webkit-box-flex: 1; -webkit-flex: 1 1 0px; flex: 1 1 0%; min-width: 0; text-align: center; padding: 6px 0 4px; }
  .hour .t { font-size: 12px; font-size: clamp(11px, 1.6vmin, 15px); font-weight: 500; color: rgba(160,190,230,0.55); }
  .hour .e { height: 28px; margin: 5px 0 3px; text-align: center; }
  .hour .e svg { width: 22px; height: 22px; display: inline-block; vertical-align: middle; color: #9ec4ff; }
  .hour .d { font-size: 16px; font-size: clamp(14px, 2vmin, 20px); font-weight: 600; font-variant-numeric: tabular-nums; color: #f0f6ff; }
  .hour .p { font-size: 12px; font-size: clamp(11px, 1.5vmin, 14px); font-weight: 600; height: 16px; color: #7ec8ff; }

  .days {
    margin-top: 8px;
    -webkit-box-flex: 1;
    -webkit-flex: 1 1 auto;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    --hi: #8cbcff;
    --lo: #c9a6ff;
    --hi-glow: rgba(140,188,255,0.5);
    --wk: rgba(160,190,230,0.8);
    --wk-icon: #9ec4ff;
  }
  .week-chart {
    width: 100%; height: 100%;
    display: block;
    font-family: inherit;
  }
  .week-chart .c-hi-line, .week-chart .c-lo-line {
    stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round;
  }
  .week-chart .c-hi-line { stroke: #8cbcff; stroke: var(--hi, #8cbcff); filter: drop-shadow(0 0 5px rgba(140,188,255,0.5)); }
  .week-chart .c-lo-line { stroke: #c9a6ff; stroke: var(--lo, #c9a6ff); }
  .week-chart .c-hi-dot { fill: #8cbcff; fill: var(--hi, #8cbcff); }
  .week-chart .c-lo-dot { fill: #c9a6ff; fill: var(--lo, #c9a6ff); }
  .week-chart .c-hi, .week-chart .c-lo { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .week-chart .c-hi { fill: #8cbcff; fill: var(--hi, #8cbcff); }
  .week-chart .c-lo { fill: #c9a6ff; fill: var(--lo, #c9a6ff); }
  .week-chart .c-wk { fill: rgba(160,190,230,0.8); fill: var(--wk, rgba(160,190,230,0.8)); font-size: 14px; font-weight: 500; }
  .week-chart .c-icon { color: #9ec4ff; color: var(--wk-icon, #9ec4ff); }
  .week-chart .c-band-top { stop-color: #8cbcff; stop-color: var(--hi, #8cbcff); stop-opacity: 0.28; }
  .week-chart .c-band-bot { stop-color: #c9a6ff; stop-color: var(--lo, #c9a6ff); stop-opacity: 0.06; }

  .wear-row {
    display: block;
    font-size: 28px;
    font-size: 3.6vw;
    font-size: clamp(20px, 6vmin, 52px);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .wear-row.home {
    font-size: 18px;
    font-size: 2.2vw;
    font-size: clamp(15px, 3.4vmin, 30px);

  .wear-row .kw { display: block; color: #f0f6ff; margin-top: 4px; }

  #fs-btn {
    position: fixed;
    z-index: 5;
    right: 12px;
    right: max(12px, env(safe-area-inset-right));

    border: 1px solid rgba(90,150,255,0.45);
    border-radius: 8px;
    background: rgba(8,12,28,0.7);
    color: rgba(160,190,230,0.75);
    cursor: pointer;
    padding: 0;
    line-height: 36px;
    text-align: center;
    font-size: 16px;
    opacity: 0.45;
  }
  #fs-btn:hover, #fs-btn:focus { opacity: 1; outline: none; }
  #fs-btn.hidden { display: none; }

  /* Narrow / portrait: time, weather, clothing stacked */
  @media (orientation: portrait), (max-aspect-ratio: 1/1), (max-width: 700px) {
    body { overflow: auto; height: auto; min-height: 100%; min-height: 100vh; min-height: 100dvh; }
    .main {
      -webkit-flex-wrap: nowrap;
      flex-wrap: nowrap;
      -webkit-flex-direction: column;
      flex-direction: column;
      height: auto;
      min-height: calc(100vh - 24px);
      min-height: calc(100dvh - 24px);
    }
    .block-time, .block-wear, .block-weather {
      width: 100%;
      height: auto;
    }
    .block-time {
      -webkit-box-ordinal-group: 2; -webkit-order: 1; order: 1;
      padding: 8px 8px 12px;
    }
    .block-weather {
      -webkit-box-ordinal-group: 3; -webkit-order: 2; order: 2;
      min-height: 0;
      -webkit-box-flex: 1; -webkit-flex: 1 1 auto; flex: 1 1 auto;
    }
    .block-wear {
      -webkit-box-ordinal-group: 4; -webkit-order: 3; order: 3;
      padding: 16px 16px;
      margin-top: 10px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }
    #clock, #now-temp {
      font-size: 64px;
      font-size: 14vw;
      font-size: clamp(52px, 14vw, 120px);
    }
    #date-line {
      font-size: 20px;
      font-size: clamp(18px, 5.5vw, 36px);
    }
    .days { min-height: 120px; height: 18vh; }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="halo a"></div><div class="halo b"></div></div>
  <div class="main">
    <section class="block-time" aria-label="Clock">
      <div id="clock">--:--</div>
      <div id="date-line">—</div>
      <div id="updated"></div>
    </section>
    <section class="block-wear" aria-label="Clothing">
      <div class="wear-row" id="outfit-row"></div>
      <div class="wear-row home" id="home-row"></div>
    </section>
    <section class="block-weather" aria-label="Weather">
      <div class="wx-hero" id="now-card">
        <div class="loc" id="loc-name"></div>
        <div class="loc-sub" id="loc-sub"></div>
        <div id="now-temp">--°</div>
        <div id="now-desc"></div>
        <div id="now-hl"></div>
        <div id="now-feel"></div>
      </div>
      <div class="aqi" id="aqi-card"></div>
      <div class="hours" id="hour-strip"></div>
      <div class="days" id="daily-row"></div>
    </section>
  </div>
  <button type="button" id="fs-btn" title="Fullscreen" aria-label="Fullscreen">⤢</button>

  }
  function saveCache() {
    try { localStorage.setItem(cacheKey(), JSON.stringify({ weather: weather, air: air, fetchedAt: fetchedAt })); }
    catch (e) {}
  }
  function loadCache() {
    try {
      var raw = localStorage.getItem(cacheKey());
      var o;
      if (!raw) return false;
      o = JSON.parse(raw);
      if (!o || !o.weather) return false;
      weather = o.weather;
      air = o.air || null;
      fetchedAt = o.fetchedAt || 0;
      return true;
    } catch (e) { return false; }
  }
  function weatherUrl() {
    return "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(place.lat) +
      "&longitude=" + encodeURIComponent(place.lon) +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,precipitation" +
      "&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset,weather_code" +
      "&timezone=" + encodeURIComponent(place.tz || "auto") +
      "&forecast_days=10&temperature_unit=celsius";
  }
  function airUrl() {
    var current = cfg.aqi === "european" ? "pm2_5,european_aqi" : "pm2_5,us_aqi";
    return "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=" + encodeURIComponent(place.lat) +
      "&longitude=" + encodeURIComponent(place.lon) +
      "&current=" + current +
      "&timezone=" + encodeURIComponent(place.tz || "auto");
  }
  function loadWeather() {
    var pending = 2;
    var wJson = null, aJson = null, wErr = false;
    function finishOne() {
      var el;
      pending -= 1;
      if (pending > 0) return;
      if (wErr || !wJson || !wJson.current || !wJson.hourly || !wJson.daily) {
        if (loadCache()) {
          fromCache = true;
          cacheNote = "net";
          renderAll();
        } else {
          el = document.getElementById("updated");
          if (el) { el.className = "stale"; el.textContent = t().failed; }
        }
        return;
      }
      weather = wJson;
      air = aJson;
      fetchedAt = (new Date()).getTime();
      fromCache = false;
      cacheNote = "";
      saveCache();
      renderAll();
    }
    getJSON(weatherUrl(), 12000, function (j) { wJson = j; finishOne(); }, function () { wErr = true; finishOne(); });
    getJSON(airUrl(), 12000, function (j) { aJson = j; finishOne(); }, function () { aJson = null; finishOne(); });
  }
  function canFullscreen() {
    var el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen || el.msRequestFullscreen);
  }
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
  }
  function requestFs() {
    var el = document.documentElement;
    try {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.webkitRequestFullScreen) el.webkitRequestFullScreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    } catch (e) {}
  }
  function exitFs() {
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.webkitCancelFullScreen) document.webkitCancelFullScreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    } catch (e) {}
  }
  function toggleFs() { if (fsElement()) exitFs(); else requestFs(); }
  function requestWakeLock() {
    if (!navigator.wakeLock || !navigator.wakeLock.request) return;
    try {
      var p = navigator.wakeLock.request("screen");
      if (p && p.then) {
        p.then(function (lock) {
          wakeLockObj = lock;
          if (lock && lock.addEventListener) {
            lock.addEventListener("release", function () { wakeLockObj = null; });
          }
        })["catch"](function () {});
      }
    } catch (e) {}
  }
  function setupCounter() {
    var id, img, src;
    try {
      if (!cfg || cfg.counter === false || cfg.counter === 0) return;
      id = cfg.counterId || "";
      if (!id) return;
      src = "https://visitor-badge.laobi.icu/badge?page_id=" + encodeURIComponent(id) + "&t=" + (new Date()).getTime();
      img = document.createElement("img");
      img.alt = "";
      img.width = 1;
      img.height = 1;
      img.style.position = "absolute";
      img.style.left = "0";
      img.style.bottom = "0";
      img.style.width = "1px";
      img.style.height = "1px";
      img.style.opacity = "0";
      img.style.pointerEvents = "none";
      img.style.border = "0";
      img.onload = function () {
        try { if (img.parentNode) img.parentNode.removeChild(img); } catch (e1) {}
      };
      img.onerror = function () {
        try { if (img.parentNode) img.parentNode.removeChild(img); } catch (e2) {}
      };
      document.body.appendChild(img);
      img.src = src;
    } catch (e) {}
  }
  function setupKeepAwake() {
    var btn = document.getElementById("fs-btn");
    if (btn) {
      if (!canFullscreen()) btn.className = "hidden";
      btn.onclick = function (ev) {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        toggleFs();
        requestWakeLock();
      };
    }
    document.addEventListener("click", function (ev) {
      var id = ev.target && ev.target.id;
      if (id === "fs-btn") return;
      requestWakeLock();
    }, false);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) requestWakeLock();
    }, false);
    requestWakeLock();
  }
  function boot() {
    var setup = applyQueryConfig();
    var mins;
    cfg = setup.cfg;
    applyDefaultPlace();
    applyChrome();
    updatePlaceLabels();
    tick();
    setInterval(tick, 1000);
    setupKeepAwake();
    setupCounter();
    resolveLocation(function () {
      fakeBase = parseDemoNow();
      pageStart = (new Date()).getTime();
      tick();
      if (loadCache()) {
        fromCache = false;
        cacheNote = "";
        renderAll();
      }
      loadWeather();
      mins = (cfg.refreshMinutes && cfg.refreshMinutes >= 1) ? cfg.refreshMinutes : 15;
      setInterval(loadWeather, mins * 60 * 1000);
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && fetchedAt && ((new Date()).getTime() - fetchedAt > mins * 60 * 1000)) loadWeather();
      }, false);
    });
  }
  boot();
})();

</script>
